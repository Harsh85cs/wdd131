<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temple Album | Abraham Lopez | WDD 131</title>
  <meta name="description" content="A responsive picture album of temples of The Church of Jesus Christ of Latter-day Saints, built for WDD 131.">
  <meta name="author" content="Abraham Lopez">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/temples.css">
  <link rel="stylesheet" href="styles/temples-large.css">
  <script src="scripts/temples.js" defer></script>

<body>
  <header>
    <div class="header-bar">
      <span class="site-title">Temple Album</span>
      <button id="menu" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="nav-menu">&#9776;</button>
    </div>
    <nav id="nav-menu" class="navigation">
      <a href="#" class="active">Home</a>
      <a href="#">Old</a>
      <a href="#">New</a>
      <a href="#">Large</a>
      <a href="#">Small</a>
    </nav>
  </header>

  <main>
    <h1>Home</h1>
    <section class="album">
      <figure>
        <img src="https://newsroom.churchofjesuschrist.org/media/640x480/Monterrey-Mexico-Temple1.jpg" alt="Monterrey Mexico Temple" width="400" height="300">
        <figcaption>Monterrey Mexico</figcaption>
      </figure>
      <figure>
        <img src="https://content.churchofjesuschrist.org/templesldsorg/bc/Temples/photo-galleries/mexico-city-mexico/400x250/mexico-city-temple-exterior-1518361-wallpaper.jpg" alt="Mexico City Mexico Temple" width="400" height="250">
        <figcaption>Mexico City Mexico</figcaption>
      </figure>
      <figure>
        <img src="https://content.churchofjesuschrist.org/templesldsorg/bc/Temples/photo-galleries/manti-utah/400x250/manti-temple-768192-wallpaper.jpg" alt="Manti Utah Temple" width="400" height="250">
        <figcaption>Manti Utah</figcaption>
      </figure>
      <figure>
        <img src="https://content.churchofjesuschrist.org/templesldsorg/bc/Temples/photo-galleries/lima-peru/400x250/lima-peru-temple-evening-1075606-wallpaper.jpg" alt="Lima Peru Temple at evening" width="400" height="250" loading="lazy">
        <figcaption>Lima Perú</figcaption>
      </figure>
      <figure>
        <img src="https://content.churchofjesuschrist.org/templesldsorg/bc/Temples/photo-galleries/washington-dc/400x250/washington_dc_temple-exterior-2.jpeg" alt="Washington D.C. Temple" width="400" height="250" loading="lazy">
        <figcaption>Washington D.C.</figcaption>
      </figure>
      <figure>
        <img src="https://content.churchofjesuschrist.org/templesldsorg/bc/Temples/photo-galleries/aba-nigeria/400x250/aba-nigeria-temple-lds-273999-wallpaper.jpg" alt="Aba Nigeria Temple" width="400" height="250" loading="lazy">
        <figcaption>Aba Nigeria</figcaption>
      </figure>
      <figure>
        <img src="https://content.churchofjesuschrist.org/templesldsorg/bc/Temples/photo-galleries/payson-utah/400x225/payson-utah-temple-exterior-1416671-wallpaper.jpg" alt="Payson Utah Temple" width="400" height="225" loading="lazy">
        <figcaption>Payson Utah</figcaption>
      </figure>
      <figure>
        <img src="https://content.churchofjesuschrist.org/templesldsorg/bc/Temples/photo-galleries/yigo-guam/400x250/yigo_guam_temple_2.jpg" alt="Yigo Guam Temple" width="400" height="250" loading="lazy">
        <figcaption>Yigo Guam</figcaption>
      </figure>
      <figure>
        <img src="https://newsroom.churchofjesuschrist.org/media/640x480/rome-italy-temple-rendering.jpg" alt="Rome Italy Temple" width="400" height="300" loading="lazy">
        <figcaption>Rome Italy</figcaption>
      </figure>
    </section>
  </main>

  <footer>
    <p>&copy;<span id="currentyear"></span> 🌎 Abraham Lopez 🌎 Nuevo León, México</p>
