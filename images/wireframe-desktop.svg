<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Arial, sans-serif" font-size="22">
  <rect width="1200" height="800" fill="#FFFFFF"/>
  <!-- Header -->
  <rect x="20" y="20" width="1160" height="90" fill="#1E2329"/>
  <rect x="40" y="35" width="60" height="60" fill="#F59E0B"/>
  <text x="115" y="72" fill="#FFFFFF">Logo / Site Name</text>
  <text x="680" y="72" fill="#FFFFFF">Home   Switches   Guides   Gallery   Contact</text>
  <!-- Hero with intro -->
  <rect x="20" y="130" width="1160" height="320" fill="#E2E8F0" stroke="#1E2329"/>
  <line x1="20" y1="130" x2="1180" y2="450" stroke="#1E2329"/>
  <line x1="1180" y1="130" x2="20" y2="450" stroke="#1E2329"/>
  <rect x="60" y="300" width="420" height="120" fill="#F5F7FA" stroke="#0F766E" stroke-width="2"/>
  <text x="210" y="368" fill="#1E2329">Intro Text</text>
  <text x="800" y="250" fill="#1E2329">Hero Image</text>
  <!-- Cards -->
  <rect x="20" y="475" width="370" height="190" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="135" y="575" fill="#0F766E">Guide Card 1</text>
  <rect x="415" y="475" width="370" height="190" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="530" y="575" fill="#0F766E">Guide Card 2</text>
  <rect x="810" y="475" width="370" height="190" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="925" y="575" fill="#0F766E">Guide Card 3</text>
  <!-- Footer -->
  <rect x="20" y="690" width="1160" height="90" fill="#1E2329"/>
  <text x="565" y="742" fill="#FFFFFF">Footer</text>
</svg>
