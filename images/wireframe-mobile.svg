<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 900" width="360" height="900" font-family="Arial, sans-serif" font-size="16">
  <rect width="360" height="900" fill="#FFFFFF"/>
  <!-- Header -->
  <rect x="10" y="10" width="340" height="70" fill="#1E2329"/>
  <rect x="25" y="25" width="40" height="40" fill="#F59E0B"/>
  <text x="75" y="52" fill="#FFFFFF">Logo / Site Name</text>
  <g fill="#FFFFFF">
    <rect x="300" y="30" width="32" height="4"/>
    <rect x="300" y="43" width="32" height="4"/>
    <rect x="300" y="56" width="32" height="4"/>
  </g>
  <!-- Hero -->
  <rect x="10" y="95" width="340" height="200" fill="#E2E8F0" stroke="#1E2329"/>
  <line x1="10" y1="95" x2="350" y2="295" stroke="#1E2329"/>
  <line x1="350" y1="95" x2="10" y2="295" stroke="#1E2329"/>
  <text x="140" y="200" fill="#1E2329">Hero Image</text>
  <!-- Intro -->
  <rect x="10" y="310" width="340" height="90" fill="#F5F7FA" stroke="#0F766E"/>
  <text x="125" y="360" fill="#1E2329">Intro Text</text>
  <!-- Cards -->
  <rect x="10" y="415" width="340" height="110" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="115" y="475" fill="#0F766E">Guide Card 1</text>
  <rect x="10" y="540" width="340" height="110" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="115" y="600" fill="#0F766E">Guide Card 2</text>
  <rect x="10" y="665" width="340" height="110" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="115" y="725" fill="#0F766E">Guide Card 3</text>
  <!-- Footer -->
  <rect x="10" y="790" width="340" height="100" fill="#1E2329"/>
  <text x="145" y="845" fill="#FFFFFF">Footer</text>
</svg>
